<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mis Redes Sociales</title>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    /* ===== FONDO GIF ITACHI ===== */

    body{
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;

      /* GIF ANIMADO DE ITACHI */
      background-image:url("itachi.gif");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      background-attachment:fixed;
    }
    

    /* ===== TARJETA ===== */

    .card{
      background:rgba(0,0,0,0.65);
      backdrop-filter:blur(8px);

      padding:40px;
      border-radius:20px;
      text-align:center;
      width:320px;

      box-shadow:0 0 25px rgba(255,0,0,0.6);
    }

    /* ===== FOTO ===== */

    .perfil{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid white;
      margin-bottom:15px;
    }

    h1{
      margin-bottom:10px;
      font-size:28px;
    }

    p{
      color:#ddd;
      margin-bottom:25px;
    }

    /* ===== REDES ===== */

    .redes a{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      text-decoration:none;
      color:white;

      padding:12px;
      margin:10px 0;

      border-radius:12px;
      font-size:18px;

      transition:0.3s;
    }

    .whatsapp{
      background:#25D366;
    }

    .instagram{
      background:#E1306C;
    }

    .tiktok{
      background:#000;
    }

    .youtube{
      background:#FF0000;
    }

    .redes a:hover{
      transform:scale(1.05);
      opacity:0.9;
    }

  </style>
</head>

<body>

  <div class="card">

    <!-- FOTO DE PERFIL -->
    <img src="perfil.jpg" alt="Foto de perfil" class="perfil">

    <h1>Matix_edits</h1>

    <p>Sígueme en mis redes sociales</p>

    <div class="redes">

      <!-- WhatsApp -->
      <a href="https://wa.me/595983744536" target="_blank" class="whatsapp">
        <i class="fab fa-whatsapp"></i>
        WhatsApp
      </a>

      <!-- Instagram -->
      <a href="https://www.instagram.com/mati.penayox_?igsh=NTE4cmQ2MWp3Mndm" target="_blank" class="instagram">
        <i class="fab fa-instagram"></i>
        Instagram
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@matix_2.01?_r=1&_t=ZS-96fLWzT9LM4" target="_blank" class="tiktok">
        <i class="fab fa-tiktok"></i>
        TikTok
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/@matix_yt01?si=uxhhUiMoB5h81vN0" target="_blank" class="youtube">
        <i class="fab fa-youtube"></i>
        YouTube
      </a>

    </div>

  </div>

</body>
</html>
