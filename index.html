  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Orbitron', sans-serif;
    }

    /* ===== BODY ===== */

    body{
      color:white;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;
      overflow-x:hidden;

      padding:20px;

      position:relative;

      background-image:url("itachi.gif");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
    }

    /* OSCURECER FONDO */

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
      z-index:0;
    }

    /* ===== PARTICULAS ===== */

    #tsparticles{
      position:fixed;
      width:100%;
      height:100%;
      top:0;
      left:0;
      z-index:0;
    }

    /* ===== TARJETA ===== */

    .card{
      background:rgba(0,0,0,0.65);

      backdrop-filter:blur(10px);

      padding:40px;

      border-radius:20px;

      text-align:center;

      width:100%;
      max-width:380px;

      position:relative;
      z-index:2;

      box-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff0000,
      0 0 40px #ff0000;

      animation:
      entrada 1s ease,
      flotar 4s ease-in-out infinite;

      transition:0.4s;
    }

    /* ===== FOTO ===== */

    .perfil{
      width:120px;
      height:120px;

      border-radius:50%;
      object-fit:cover;

      border:4px solid white;

      margin-bottom:15px;

      transition:0.4s;

      box-shadow:
      0 0 10px red,
      0 0 20px red;
    }

    .perfil:hover{
      transform:scale(1.08) rotate(3deg);
    }

    /* ===== TITULO ===== */

    h1{
      margin-bottom:10px;
      font-size:28px;

      text-shadow:
      0 0 5px red,
      0 0 10px red,
      0 0 20px red;
    }

    p{
      color:#ddd;
      margin-bottom:25px;
      font-size:14px;
    }

    /* ===== REDES ===== */

    .redes a{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      text-decoration:none;
      color:white;

      padding:12px;
      margin:10px 0;

      border-radius:12px;
      font-size:18px;

      transition:0.3s;

      position:relative;
      overflow:hidden;
    }

    /* BRILLO */

    .redes a::before{
      content:"";

      position:absolute;

      top:0;
      left:-100%;

      width:100%;
      height:100%;

      background:rgba(255,255,255,0.2);

      transition:0.5s;
    }

    /* COLORES */

    .whatsapp{
      background:#25D366;
    }

    .instagram{
      background:#E1306C;
    }

    .tiktok{
      background:#000;
    }

    .youtube{
      background:#FF0000;
    }

    .discord{
      background:#5865F2;
    }

    /* HOVER */

    .redes a:hover{
      transform:scale(1.07) translateY(-3px);

      opacity:0.95;

      box-shadow:
      0 0 10px white,
      0 0 20px white;
    }

    .redes a:hover::before{
      left:100%;
    }

    /* ===== ANIMACION ENTRADA ===== */

    @keyframes entrada{

      from{
        opacity:0;
        transform:scale(0.8);
      }

      to{
        opacity:1;
        transform:scale(1);
      }

    }

    /* ===== ANIMACION FLOTAR ===== */

    @keyframes flotar{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    /* ===== MOVIL ===== */

    @media(max-width:768px){

      body{
        align-items:flex-start;

        padding-top:40px;

        background-attachment:scroll;
        background-position:center top;
      }

      .card{
        padding:25px;
        border-radius:18px;
      }

      .perfil{
        width:95px;
        height:95px;
      }

      h1{
        font-size:24px;
      }

      p{
        font-size:13px;
      }

      .redes a{
        font-size:16px;
        padding:11px;
      }

    }

    /* ===== PC GRANDE ===== */

    @media(min-width:1200px){

      .card{
        max-width:430px;
        padding:45px;
      }

      h1{
        font-size:34px;
      }

      .perfil{
        width:130px;
        height:130px;
      }

      .redes a{
        font-size:19px;
        padding:14px;
      }

    }

    /* ===== DETECCION MOVIL ===== */

    .movil .card{
      backdrop-filter:blur(5px);
    }

    .movil #tsparticles{
      opacity:0.5;
    }

    .movil .redes a{
      font-size:16px;
    }

    /* ===== DETECCION PC ===== */

    .pc .card{
      transform-style:preserve-3d;
    }

    .pc .card:hover{
      transform:
      rotateX(5deg)
      rotateY(-5deg)
      scale(1.02);
    }

    .pc .redes a:hover{
      transform:
      scale(1.08)
      translateY(-5px);
    }

    .pc #tsparticles{
      opacity:1;
    }

  </style>
</head>
